<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="3D Geospatial and Digital Twin Automation">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f4ef"/>
      <stop offset="1" stop-color="#e3f0f4"/>
    </linearGradient>
    <linearGradient id="og-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79c0d8"/>
      <stop offset="1" stop-color="#1f6b8a"/>
    </linearGradient>
    <linearGradient id="og-terrain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa56e"/>
      <stop offset="1" stop-color="#4f7a4d"/>
    </linearGradient>
    <linearGradient id="og-earth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#c46a3d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- Decorative contour lines (bottom) -->
  <g fill="none" stroke="#1f6b8a" stroke-opacity="0.12" stroke-width="2" stroke-linecap="round">
    <path d="M -50 470 C 200 410, 400 530, 650 460 S 1100 430, 1260 480"/>
    <path d="M -50 525 C 220 475, 420 585, 660 505 S 1100 485, 1260 535"/>
    <path d="M -50 580 C 240 540, 440 620, 680 560 S 1100 540, 1260 590"/>
  </g>

  <!-- Glow accents -->
  <circle cx="1040" cy="160" r="220" fill="#d9a441" fill-opacity="0.15"/>
  <circle cx="120" cy="100" r="160" fill="#79c0d8" fill-opacity="0.20"/>

  <!-- Brand mark -->
  <g transform="translate(70 70)">
    <rect width="120" height="120" rx="22" ry="22" fill="url(#og-sky)"/>
    <g transform="translate(20 20) scale(1.25)" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <polygon points="32,12 46,20 32,28 18,20" fill="url(#og-earth)" fill-opacity="0.95"/>
      <polygon points="18,20 32,28 32,44 18,36" fill="url(#og-terrain)" fill-opacity="0.95"/>
      <polygon points="46,20 32,28 32,44 46,36" fill="#ffffff" fill-opacity="0.20"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="220" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#1f2937">3D Geospatial</text>
  <text x="220" y="158" font-family="sans-serif" font-size="20" font-weight="400" fill="#5b6471" letter-spacing="4">DIGITAL TWIN AUTOMATION</text>

  <!-- Headline (solid fills, no gradients to keep librsvg happy) -->
  <text x="70" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#1f2937">Reliable 3D spatial</text>
  <text x="70" y="362" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#1f6b8a">pipelines for digital twins</text>

  <!-- Subhead -->
  <text x="70" y="424" font-family="sans-serif" font-size="26" font-weight="400" fill="#5b6471">Point clouds, mesh processing, LOD streaming, Python and CI/CD.</text>

  <!-- Pills -->
  <g font-family="sans-serif" font-size="20" font-weight="600" fill="#ffffff">
    <g transform="translate(70 478)">
      <rect width="170" height="46" rx="23" ry="23" fill="#1f6b8a"/>
      <text x="85" y="30" text-anchor="middle">Point Clouds</text>
    </g>
    <g transform="translate(256 478)">
      <rect width="120" height="46" rx="23" ry="23" fill="#4f7a4d"/>
      <text x="60" y="30" text-anchor="middle">Meshes</text>
    </g>
    <g transform="translate(392 478)">
      <rect width="200" height="46" rx="23" ry="23" fill="#c46a3d"/>
      <text x="100" y="30" text-anchor="middle">LOD and 3D Tiles</text>
    </g>
    <g transform="translate(608 478)">
      <rect width="200" height="46" rx="23" ry="23" fill="#d9a441"/>
      <text x="100" y="30" text-anchor="middle" fill="#1f2937">CI/CD and Python</text>
    </g>
  </g>

  <!-- URL -->
  <text x="70" y="590" font-family="sans-serif" font-size="24" font-weight="700" fill="#1f6b8a" letter-spacing="1">www.3d-geospatial.com</text>
</svg>
