<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="3D Geospatial maskable logo">
  <defs>
    <linearGradient id="ms-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79c0d8"/>
      <stop offset="1" stop-color="#1f6b8a"/>
    </linearGradient>
    <linearGradient id="ms-terrain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa56e"/>
      <stop offset="1" stop-color="#4f7a4d"/>
    </linearGradient>
    <linearGradient id="ms-earth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#c46a3d"/>
    </linearGradient>
  </defs>
  <!-- Full bleed background for maskable -->
  <rect x="0" y="0" width="64" height="64" fill="url(#ms-sky)"/>
  <!-- Centered art inside 80% safe zone -->
  <g transform="translate(6 8) scale(0.81)">
    <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round">
      <path d="M6 44 C 18 36, 28 50, 40 42 S 58 38, 60 44"/>
      <path d="M6 50 C 18 44, 30 56, 42 48 S 58 46, 60 50"/>
    </g>
    <g stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <polygon points="32,12 46,20 32,28 18,20" fill="url(#ms-earth)" fill-opacity="0.95"/>
      <polygon points="18,20 32,28 32,44 18,36" fill="url(#ms-terrain)" fill-opacity="0.95"/>
      <polygon points="46,20 32,28 32,44 46,36" fill="#ffffff" fill-opacity="0.18"/>
    </g>
  </g>
</svg>
