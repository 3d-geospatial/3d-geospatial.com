<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="3D Geospatial logo">
  <defs>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79c0d8"/>
      <stop offset="1" stop-color="#1f6b8a"/>
    </linearGradient>
    <linearGradient id="g-terrain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa56e"/>
      <stop offset="1" stop-color="#4f7a4d"/>
    </linearGradient>
    <linearGradient id="g-earth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#c46a3d"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile background -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="url(#g-sky)"/>

  <!-- Stylised contour lines (geo / terrain) -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round">
    <path d="M6 44 C 18 36, 28 50, 40 42 S 58 38, 60 44"/>
    <path d="M6 50 C 18 44, 30 56, 42 48 S 58 46, 60 50"/>
    <path d="M6 38 C 16 30, 30 44, 42 36 S 58 32, 60 38"/>
  </g>

  <!-- Isometric wireframe cube (digital twin) -->
  <g stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- top face -->
    <polygon points="32,12 46,20 32,28 18,20" fill="url(#g-earth)" fill-opacity="0.95"/>
    <!-- left face -->
    <polygon points="18,20 32,28 32,44 18,36" fill="url(#g-terrain)" fill-opacity="0.95"/>
    <!-- right face -->
    <polygon points="46,20 32,28 32,44 46,36" fill="#ffffff" fill-opacity="0.18"/>
  </g>

  <!-- Sparkle / data point -->
  <circle cx="50" cy="14" r="2.2" fill="#d9a441"/>
</svg>
